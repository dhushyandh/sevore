  <path
    d="M 53 82 C 55 69 66 61 79 57 C 78 71 68 83 53 82 Z"
    fill="url(#leafGrad)"
  />
  <!-- Leaf Central Vein -->
  <path
    d="M 54 81 C 61 74 69 68 76 60"
    stroke="#D99A45"
    stroke-width="1.2"
    stroke-linecap="round"
    fill="none"
